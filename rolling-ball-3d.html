<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沿透明轨道前进的球 · 关卡版 (GSAP 质感增强版)</title>
<!-- GSAP Core & Plugins -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
  :root {
    --bg: #040711; 
    --panel: rgba(13, 20, 36, 0.75); 
    --bd: rgba(120, 170, 255, 0.2);
    --bd-glow: rgba(74, 214, 255, 0.4);
    --fg: #f0f5ff; 
    --dim: #8fa5c7; 
    --gold: #ffcf33; 
    --cyan: #4ae3ff; 
    --good: #4ceb9c; 
    --danger: #ff4d61;
    --r: 22px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { 
    cursor: crosshair; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--fg);
    perspective: 1000px;
  }
  canvas { display: block; position: absolute; }

  /* 提示条 */
  .tip {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    color: var(--dim); font-size: 13px; line-height: 1.4;
    background: rgba(10, 16, 30, 0.7); padding: 8px 22px; border-radius: 30px; 
    border: 1px solid var(--bd);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    pointer-events: none; user-select: none; z-index: 5; max-width: 90vw; text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tip strong { color: var(--cyan); font-weight: 700; }

  /* HUD 抬头显示 */
  #hud {
    position: fixed; left: 20px; top: 20px; z-index: 10;
    background: rgba(10, 16, 30, 0.65); padding: 14px 22px 16px; border-radius: var(--r);
    border: 1px solid var(--bd);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.15);
    pointer-events: none; user-select: none; display: none; min-width: 270px;
    transform-origin: top left;
  }
  #hudScore {
    font-weight: 900; font-size: 42px; line-height: 1;
    background: linear-gradient(135deg, #fff 20%, var(--gold) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: 1px; filter: drop-shadow(0 0 12px rgba(255,207,51,0.4));
    display: inline-block;
  }
  #hudSub {
    font-weight: 700; font-size: 13px; line-height: 1.5;
    color: var(--dim); margin: 6px 0 12px; letter-spacing: 0.4px;
  }

  /* 轨道形状进度条 */
  #progTrack {
    position: relative; width: 100%; height: 12px; border-radius: 8px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
  }
  #progTrack::before, #progTrack::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.2);
  }
  #progTrack::before { left: 33.33%; }
  #progTrack::after  { left: 66.66%; }
  #progBall {
    position: absolute; top: 50%; left: 0; width: 14px; height: 14px; border-radius: 50%;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle at 35% 35%, #ffffff, var(--gold) 75%);
    box-shadow: 0 0 12px rgba(255,207,51,0.9);
  }
  #progFlag { position: absolute; right: 4px; top: -5px; font-size: 13px; filter: drop-shadow(0 0 6px rgba(255,207,51,0.8)); }

  /* 通用覆盖层 UI */
  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(4, 7, 17, 0.65); 
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); z-index: 20;
    opacity: 0;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--bd); border-radius: 28px;
    padding: 36px 44px; text-align: center; color: var(--fg);
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    box-shadow: 0 30px 90px rgba(0,0,0,0.65), inset 0 1px 1px rgba(255,255,255,0.2);
    width: min(92vw, 540px); max-width: 100%;
    transform-style: preserve-3d;
  }
  .panel h1 { 
    font-weight: 800; font-size: 34px; line-height: 1.1; color: var(--fg); margin-bottom: 10px;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  .panel .sub { color: var(--dim); font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
  
  #win .panel {
    border-color: rgba(76,235,156,0.35);
    box-shadow: 0 30px 90px rgba(0,0,0,0.7), 0 0 45px rgba(76,235,156,0.15);
  }
  #fail .panel {
    border-color: rgba(255,77,97,0.35);
    box-shadow: 0 30px 90px rgba(0,0,0,0.7), 0 0 45px rgba(255,77,97,0.15);
  }

  /* 精美按钮 */
  .btn {
    cursor: pointer; border: none; border-radius: 14px; padding: 14px 32px; font-size: 16px; font-weight: 700;
    color: #061826; background: linear-gradient(135deg, #8ae6ff 0%, #4ae3ff 100%);
    box-shadow: 0 8px 24px rgba(74,227,255,0.35), inset 0 1px 1px rgba(255,255,255,0.6); 
    margin: 6px; letter-spacing: 0.5px; display: inline-block; position: relative; overflow: hidden;
    outline: none;
  }
  .btn.ghost { 
    background: rgba(255,255,255,0.06); color: var(--fg); 
    border: 1px solid var(--bd); box-shadow: 0 4px 16px rgba(0,0,0,0.2); 
  }
  .btn:disabled { background: rgba(255,255,255,0.08); color: var(--dim); cursor: not-allowed; box-shadow: none; border: none; }

  /* 选关界面：列表式音乐曲库布局 (Music Track List Layout) */
  #menu .panel { padding: 32px 36px 32px; width: min(94vw, 580px); max-height: 85vh; display: flex; flex-direction: column; }
  #menu h1 { margin-bottom: 4px; }
  #menu .sub { margin-bottom: 16px; }
  #cards { 
    display: flex; flex-direction: column; gap: 10px; margin-top: 4px; 
    max-height: 420px; overflow-y: auto; padding-right: 6px; 
  }
  #cards::-webkit-scrollbar { width: 6px; }
  #cards::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); border-radius: 4px; }
  #cards::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
  
  .song-item {
    background: rgba(255,255,255,0.04); border: 1px solid var(--bd); border-radius: 16px;
    padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none; transition: background 0.2s ease, border-color 0.2s ease;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .song-item:hover:not(.locked) {
    background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.3);
  }
  .song-item .song-info { display: flex; align-items: center; gap: 16px; text-align: left; }
  .song-item .song-num { font-weight: 900; font-size: 22px; color: var(--gold); min-width: 32px; }
  .song-item .song-title { font-weight: 800; font-size: 16px; color: var(--fg); }
  .song-item .song-meta { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .song-item .song-bpm { 
    background: rgba(138,230,255,0.15); color: #8ae6ff; font-weight: 700; font-size: 11px; 
    padding: 2px 8px; border-radius: 8px; margin-left: 8px; display: inline-block;
  }
  .song-item .song-right { text-align: right; }
  .song-item .stars { color: var(--gold); font-size: 13px; letter-spacing: 1px; }
  .song-item .st { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .song-item.locked { background: rgba(255,255,255,0.02); cursor: not-allowed; opacity: 0.5; filter: grayscale(0.8); }
  .song-item.cleared { border-color: rgba(76,235,156,0.45); background: rgba(76,235,156,0.08); }
  .song-item.cleared .song-title { color: var(--good); }

  /* 主界面（首页） */
  #home { display: flex; opacity: 1; background: radial-gradient(ellipse at 50% 40%, rgba(14,24,46,0.4), rgba(4,7,17,0.8)); }
  .home-card {
    background: rgba(12, 20, 36, 0.55);
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 32px; padding: 48px 56px; text-align: center;
    box-shadow: 0 35px 100px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,255,255,0.25); 
    width: min(90vw, 460px); max-width: 100%;
    transform-style: preserve-3d;
  }
  .home-title {
    font-weight: 900; font-size: 58px; line-height: 1;
    background: linear-gradient(135deg, #ffffff 30%, #ffd23f 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: 3px; margin-bottom: 12px; 
    filter: drop-shadow(0 4px 20px rgba(255,210,63,0.35));
  }
  .home-sub { color: var(--fg); font-size: 16px; line-height: 1.6; margin-bottom: 8px; opacity: 0.95; letter-spacing: 0.5px; }
  .home-prog { color: var(--dim); font-size: 14px; line-height: 1.5; margin-bottom: 32px; }
  .home-btn {
    cursor: pointer; border: none; border-radius: 16px; padding: 16px 56px; font-size: 20px; font-weight: 800;
    color: #061826; background: linear-gradient(135deg, #ffe792 0%, #8ae6ff 100%);
    box-shadow: 0 10px 32px rgba(138,230,255,0.45), inset 0 1px 1px rgba(255,255,255,0.7); 
    letter-spacing: 1px; outline: none; position: relative; display: inline-block;
  }
  .home-ghost {
    display: block; margin: 16px auto 0; cursor: pointer; border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.06); color: var(--fg); border-radius: 14px;
    padding: 10px 30px; font-size: 15px; font-weight: 600; outline: none;
  }

  /* 暂停页进度 */
  .prog { font-size: 15px; line-height: 1.6; color: var(--dim); margin-bottom: 20px; }
  .prog b { color: var(--gold); }

  /* 精准奖励弹字（右上角） */
  #reward {
    position: fixed; right: 32px; top: 24px; text-align: right;
    font-weight: 900; font-size: 46px; line-height: 1;
    pointer-events: none; user-select: none; opacity: 0; z-index: 15;
    text-shadow: 0 4px 24px rgba(0,0,0,0.6);
    transform-origin: center right;
  }
  #reward.perfect { 
    background: linear-gradient(135deg, #fff, #ffd23f);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px rgba(255,210,63,0.6));
  }
  #reward.great { 
    background: linear-gradient(135deg, #fff, #4ad6ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px rgba(74,214,255,0.6));
  }

  /* 连击计数 */
  #combo {
    position: fixed; right: 32px; top: 82px; z-index: 15;
    font-weight: 900; font-size: 30px; line-height: 1;
    background: linear-gradient(135deg, #ffaa3d, #ff5a5a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(255,138,61,0.6));
    pointer-events: none; user-select: none; opacity: 0;
    transform-origin: center right;
  }

  /* 移动端响应式适配 */
  @media (max-width: 600px) {
    .panel { padding: 26px 20px; border-radius: 22px; }
    .panel h1 { font-size: 26px; }
    .home-card { padding: 32px 20px; border-radius: 24px; }
    .home-title { font-size: 40px; letter-spacing: 2px; }
    .home-sub { font-size: 13px; }
    .home-btn { padding: 14px 42px; font-size: 17px; }
    #menu .panel { padding: 24px 16px 26px; }
    #cards { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card { padding: 12px 8px; }
    .card .lv { font-size: 22px; }
    .card .stars { font-size: 12px; margin: 4px 0; }
    .card .st { font-size: 11px; min-height: 26px; }
    .btn { padding: 12px 22px; font-size: 14px; margin: 4px; }
    #hud { top: 12px; left: 12px; padding: 10px 14px 12px; min-width: 200px; }
    #hudScore { font-size: 32px; }
    #hudSub { font-size: 11px; margin: 4px 0 8px; }
    #reward { right: 16px; top: 16px; font-size: 32px; }
    #combo { right: 16px; top: 56px; font-size: 22px; }
    .tip { font-size: 11px; padding: 6px 14px; bottom: 12px; }
  }

  /* 关卡开始 3D 倒计时 */
  #countdown {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-weight: 900; font-size: 110px; line-height: 1; color: #ffffff;
    pointer-events: none; user-select: none; opacity: 0; z-index: 25;
    text-shadow: 0 10px 40px rgba(0,0,0,0.85), 0 0 30px rgba(138,230,255,0.8);
    font-family: system-ui, -apple-system, sans-serif;
    letter-spacing: 2px;
  }
  #countdown.go {
    background: linear-gradient(135deg, #ffffff 30%, #ffd23f 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 35px rgba(255,210,63,0.95));
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="countdown"></div>
<div id="hud">
  <div id="hudScore">0</div>
  <div id="hudSub"></div>
  <div id="progTrack"><div id="progBall"></div><div id="progFlag">🏁</div></div>
</div>
<div id="reward"></div>
<div id="combo"></div>
<div class="tip">🖱️ 移动鼠标切<strong>同色轨道</strong> · 🌟 踩金色轨变色不死 · 落点踩实得 <strong>PERFECT</strong> · ESC 暂停</div>

<!-- 主界面（首页）：3D 背景 + 毛玻璃卡 -->
<div id="home" class="overlay">
  <div class="home-card">
    <div class="home-title">轨道球</div>
    <div class="home-sub">ROLLING ORB · 跳上轨道，别踩错颜色</div>
    <div class="home-prog" id="homeProg"></div>
    <button class="home-btn" id="playBtn">开始游戏</button>
    <button class="home-ghost" id="homeToMenu">选关</button>
  </div>
</div>

<!-- 选关界面 -->
<input type="file" id="mp3Input" accept="audio/*" style="display:none">
<div id="menu" class="overlay">
  <div class="panel">
    <h1>选择关卡</h1>
    <div class="sub">音乐曲库 · 9 关节奏律动（支持导入任意 MP3 实时生成轨道）</div>
    <button class="btn" id="uploadMp3Btn" style="background:linear-gradient(135deg,#ff92e3 0%,#8ae6ff 100%);color:#061826;margin-bottom:14px">🎵 导入 MP3 生成《情歌》专属轨道</button>
    <div id="cards"></div>
    <button class="btn ghost" id="menuToHome" style="margin-top:16px">返回首页</button>
  </div>
</div>

<!-- 暂停页 -->
<div id="pause" class="overlay">
  <div class="panel">
    <h1>已暂停</h1>
    <div class="prog" id="pauseProg"></div>
    <div>
      <button class="btn" id="resumeBtn">继续</button>
      <button class="btn ghost" id="restartBtn">重新开始本关</button>
      <button class="btn ghost" id="toMenuBtn">返回选关</button>
    </div>
  </div>
</div>

<!-- 失败页 -->
<div id="fail" class="overlay">
  <div class="panel">
    <h1 style="color:#ff5a6a">失败</h1>
    <div class="sub">小球颜色与轨道颜色不一致</div>
    <div>
      <button class="btn" id="retry">重新开始</button>
      <button class="btn ghost" id="failToMenu">返回选关</button>
    </div>
  </div>
</div>

<!-- 通关页 -->
<div id="win" class="overlay">
  <div class="panel">
    <h1 style="color:#4ceb9c">通关！</h1>
    <div class="sub" id="winSub"></div>
    <div>
      <button class="btn" id="nextBtn">下一关</button>
      <button class="btn ghost" id="winToMenu">返回选关</button>
    </div>
  </div>
</div>

<!-- GSAP & Three.js UMD Standard Libraries (100% file:/// & HTTP Compatible) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

<script>
class RoundedBoxGeometry extends THREE.BoxGeometry {
  constructor(w, h, d, seg, r) {
    super(w, h, d, Math.max(1, seg || 2), Math.max(1, seg || 2), Math.max(1, seg || 2));
  }
}

const canvas = document.getElementById('c');
const STAGE_ASPECT = 16 / 9;          // 居中固定比例舞台
function layoutStage() {
  const w = innerWidth, h = innerHeight;
  let sw = w, sh = w / STAGE_ASPECT;
  if (sh > h) { sh = h; sw = h * STAGE_ASPECT; }
  canvas.style.position = 'absolute';
  canvas.style.left = ((w - sw) / 2) + 'px';
  canvas.style.top  = ((h - sh) / 2) + 'px';
  canvas.style.width = sw + 'px';
  canvas.style.height = sh + 'px';
  renderer.setSize(sw, sh, false);    
  camera.aspect = sw / sh; camera.updateProjectionMatrix();
}

// ---- 场景 / 固定相机 ----
const scene = new THREE.Scene();
function makeBgTexture() {
  const cv = document.createElement('canvas'); cv.width = 2; cv.height = 256;
  const g = cv.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, '#040816'); grd.addColorStop(0.5, '#0a1228'); grd.addColorStop(1, '#050a1a');
  g.fillStyle = grd; g.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}
scene.background = makeBgTexture();
scene.fog = new THREE.Fog(0x060c1d, 30, 95);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 5, 11);
camera.lookAt(0, 1.0, -4);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
layoutStage();                                   
addEventListener('resize', layoutStage);

// ---- 光照 ----
scene.add(new THREE.HemisphereLight(0xd4e5ff, 0x162035, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(6, 16, 9);
scene.add(sun);
const rimLight = new THREE.DirectionalLight(0x7fe0ff, 0.9);
rimLight.position.set(-6, 8, -12);
scene.add(rimLight);

// ---- 基础几何参数 ----
const LANES = 3;
const LANE_W = 2.0;
const LANE_GAP = 0.5;
const LANE_STEP = LANE_W + LANE_GAP;
const TRACK_HALF = (LANES * LANE_W + (LANES - 1) * LANE_GAP) / 2;  // 3.5
const ballR = 0.9;
const JUMP_H = 1.5;
const TILE_H = 0.65;                 // 增加厚度，增强 3D 厚重胶囊感
const TOP_INSET = 0.20;              // 增加顶面内缩，露出明显的 3D 外框包裹圈
const SHAKE_AMP = 0.12;               
const SHAKE_DUR = 0.28;              
const SHAKE_FREQ = 40;              
const MUSIC_PITCH = 3.6;           
const MUSIC_GAP = 0.7;             
const SHORT_D = MUSIC_PITCH - MUSIC_GAP;   

const laneXs = [];
for (let li = 0; li < LANES; li++) laneXs.push((li - (LANES - 1) / 2) * LANE_STEP);

// ---- 难度曲线（8 关）----
function levelParams(n) {           
  const x = (n - 1) / 7;            
  return {
    SPEED: 6 + x * 5,                                  
    HOP_PERIOD: 1.0 - x * 0.45,                        
    SPECIAL_EVERY: Math.round(5 + x * 4),              
    levelDist: 150 + n * 50                            
  };
}
function starCount(n) { return Math.min(5, Math.ceil(n / 1.6)); }  

const PERFECT_RATIO = 0.7;   

// ---- 音乐节拍与 Web Audio 8 关完整曲库 ----
const NOTE_FREQ = { 
  C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
  C4:261.63, Db4:277.18, D4:293.66, Eb4:311.13, E4:329.63, F4:349.23, Gb4:369.99, G4:392.00, Ab4:415.30, A4:440.00, Bb4:466.16, B4:493.88, 
  C5:523.25, Db5:554.37, D5:587.33, Eb5:622.25, E5:659.25, F5:698.46, Gb5:739.99, G5:783.99, Ab5:830.61, A5:880.00, Bb5:932.33, B5:987.77,
  C6:1046.50
};
const NOTE_COLOR = { 
  C3:0, Eb3:0, G3:0, C4:0, Eb4:0, G4:0, Ab4:0, C5:0, Eb5:0, G5:0, Ab5:0, C6:0,
  D3:1, F3:1, Bb3:1, D4:1, F4:1, Bb4:1, B4:1, D5:1, F5:1, Bb5:1, B5:1,
  E3:2, A3:2, E4:2, Gb4:2, A4:2, Db5:2, E5:2, Gb5:2, A5:2 
};

// 1. 小星星 (BPM 112 - 完整 48 拍)

// ---- 完整 MP3 音频节奏提取与 4 轨音符生成模块 (AudioNoteExtractor Module) ----
class AudioNoteExtractor {
  constructor(options = {}) {
    this.frameMs = options.frameMs || 30;                 // 包络采样窗口 (30ms)
    this.minNoteGapMs = options.minNoteGapMs || 150;     // 单轨防叠键最小间隔 (150ms)
    this.thresholdMultiplier = options.thresholdMultiplier || 1.35; // 动态阈值过滤系数
    this.numLanes = options.numLanes || 4;               // 4 轨 (Lanes 0~3)
  }

  /**
   * 将 AudioBuffer 或 ArrayBuffer 解析为 4 轨 Note 数组
   * @param {AudioBuffer|ArrayBuffer} input - 音频输入
   * @param {AudioContext} [audioCtx] - Web Audio Context 实例
   * @returns {Promise<Array<{ id: string, time: number, lane: number, hit: boolean }>>}
   */
  async extractNotes(input, audioCtx = null) {
    let audioBuffer = input;
    if (input instanceof ArrayBuffer) {
      const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      audioBuffer = await ctx.decodeAudioData(input);
    }

    const sampleRate = audioBuffer.sampleRate;
    const channelData = audioBuffer.getChannelData(0); // 主声道 PCM
    const frameSize = 1024;
    const hopSize = 512;
    const numFrames = Math.floor((channelData.length - frameSize) / hopSize);

    // 1. 低通滤波器 (<250Hz 低频 Bass/Kick 分离)
    const rc = 1.0 / (2 * Math.PI * 250);
    const dt = 1.0 / sampleRate;
    const alpha = dt / (rc + dt);

    let lowFilteredSample = 0;
    const filteredPCM = new Float32Array(channelData.length);
    for (let i = 0; i < channelData.length; i++) {
      const s = channelData[i];
      lowFilteredSample += alpha * (s - lowFilteredSample);
      filteredPCM[i] = lowFilteredSample;
    }

    // 2. 帧包络与频段能量提取
    const fullEnergies = new Float32Array(numFrames);
    const lowEnergies = new Float32Array(numFrames);
    const midHighEnergies = new Float32Array(numFrames);

    let totalEnergySum = 0;
    for (let f = 0; f < numFrames; f++) {
      const offset = f * hopSize;
      let sumFull = 0, sumLow = 0;
      for (let j = 0; j < frameSize; j += 4) {
        const sf = channelData[offset + j];
        const sl = filteredPCM[offset + j];
        sumFull += sf * sf;
        sumLow += sl * sl;
      }
      const eFull = Math.sqrt(sumFull / (frameSize / 4));
      const eLow = Math.sqrt(sumLow / (frameSize / 4));
      const eMidHigh = Math.max(0, eFull - eLow);

      fullEnergies[f] = eFull;
      lowEnergies[f] = eLow;
      midHighEnergies[f] = eMidHigh;
      totalEnergySum += eFull;
    }

    // 3. 动态阈值 Peak 重音/鼓点瞬间检测
    const avgEnergy = totalEnergySum / Math.max(1, numFrames);
    const threshold = avgEnergy * this.thresholdMultiplier;
    const rawPeaks = [];

    for (let f = 2; f < numFrames - 2; f++) {
      const e = fullEnergies[f];
      if (e > threshold && e > fullEnergies[f - 1] && e > fullEnergies[f - 2] && e >= fullEnergies[f + 1] && e >= fullEnergies[f + 2]) {
        const timeSec = Number(((f * hopSize) / sampleRate).toFixed(3));
        const isLowBass = lowEnergies[f] > midHighEnergies[f] * 0.9;
        rawPeaks.push({ frame: f, time: timeSec, isLowBass });
      }
    }

    // 4. 频域 4 轨映射 (0~3 轨) 与 150ms 防叠键保护
    const notes = [];
    const lastLaneTimes = [-999, -999, -999, -999];
    const minGapSec = this.minNoteGapMs / 1000;

    let outerTurn = 0; // 外轨 (0 或 3)
    let innerTurn = 1; // 内轨 (1 或 2)

    for (let k = 0; k < rawPeaks.length; k++) {
      const peak = rawPeaks[k];
      const time = peak.time;
      let preferredLanes = [];

      if (peak.isLowBass) {
        // 低频 (<250Hz) 分配到外侧轨道 0 或 3
        preferredLanes = (outerTurn === 0) ? [0, 3, 1, 2] : [3, 0, 2, 1];
        outerTurn = 1 - outerTurn;
      } else {
        // 中高频 (>250Hz) 分配到内侧轨道 1 或 2
        preferredLanes = (innerTurn === 1) ? [1, 2, 0, 3] : [2, 1, 3, 0];
        innerTurn = 3 - innerTurn;
      }

      // 防叠键校验：按优先级选择相邻 >= 150ms 的轨道
      let targetLane = -1;
      for (const lane of preferredLanes) {
        if (time - lastLaneTimes[lane] >= minGapSec) {
          targetLane = lane;
          break;
        }
      }

      if (targetLane === -1) {
        let maxGap = -1;
        for (let l = 0; l < this.numLanes; l++) {
          const gap = time - lastLaneTimes[l];
          if (gap > maxGap) {
            maxGap = gap;
            targetLane = l;
          }
        }
      }

      lastLaneTimes[targetLane] = time;

      notes.push({
        id: `note_${k}_lane${targetLane}_${Math.round(time * 1000)}`,
        time: time,
        lane: targetLane,
        hit: false
      });
    }

    return notes;
  }
}

// 实例实例化
const noteExtractor = new AudioNoteExtractor({ frameMs: 30, minNoteGapMs: 150, thresholdMultiplier: 1.35, numLanes: 4 });

// ---- MP3 节奏实时分析与 3D 轨道生成 ----
function loadMp3Audio(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    const arrayBuffer = e.target.result;
    const ctx = ensureCtx();
    try {
      const decodedData = await ctx.decodeAudioData(arrayBuffer);
      const notes = await noteExtractor.extractNotes(decodedData, ctx);
      
      const songTitle = file.name.replace(/\.[^/.]+$/, "");
      SONGS[9] = {
        name: `情歌 · ${songTitle}`,
        bpm: 120,
        notes: notes,
        events: notes.map(n => ({ b: n.time * 2, d: 1, n: 'C5' })),
        isCustomMp3: true,
        audioBuffer: decodedData
      };

      unlocked = Math.max(unlocked, 9);
      saveProgress();
      buildMenu();
      startLevel(9);
    } catch (err) {
      alert("MP3 音频解码失败，请更换标准的 MP3 格式音乐！");
    }
  };
  reader.readAsArrayBuffer(file);
}

// ---- 音频合成与播放 ----
let actx = null, scheduledNodes = [], usingAudio = false, audioStart = 0;
function ensureCtx() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  return actx;
}
function scheduleNote(ctx, f, t0, dur) {
  const osc = ctx.createOscillator(); osc.type = 'triangle'; osc.frequency.value = f;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.32, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
  scheduledNodes.push(osc);
}
function startAudio(song) {
  const ctx = ensureCtx(); if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  stopAudio();
  audioStart = ctx.currentTime;

  if (song.isCustomMp3 && song.audioBuffer) {
    const source = ctx.createBufferSource();
    source.buffer = song.audioBuffer;
    source.connect(ctx.destination);
    source.start(audioStart);
    scheduledNodes.push(source);
    usingAudio = true;
    return;
  }

  const beat = 60 / song.bpm;
  const evs = song.events || song.notes.map((n, k) => ({ b: k, d: 1, n }));
  for (const e of evs) {
    const f = NOTE_FREQ[e.n]; if (!f) continue;
    scheduleNote(ctx, f, audioStart + e.b * beat, e.d * beat * 0.95);
  }
  usingAudio = true;
}
function stopAudio() {
  usingAudio = false;
  for (const n of scheduledNodes) { try { n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} }
  scheduledNodes.length = 0;
}

function makeBallTexture() {
  const s = 512;
  const cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d');
  
  const grad = g.createRadialGradient(s * 0.35, s * 0.35, 10, s * 0.5, s * 0.5, s * 0.5);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.5, '#f4f6fa');
  grad.addColorStop(1, '#d8e2f0');
  g.fillStyle = grad; g.fillRect(0, 0, s, s);

  g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = 6;
  g.beginPath(); g.arc(s/2, s/2, s*0.42, 0, Math.PI * 2); g.stroke();

  g.fillStyle = 'rgba(255,255,255,0.75)';
  g.beginPath(); g.ellipse(s*0.3, s*0.28, s*0.12, s*0.06, -Math.PI/6, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(s*0.7, s*0.72, s*0.08, s*0.04, -Math.PI/6, 0, Math.PI*2); g.fill();

  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const SEG_COLORS = [0xff2e63, 0x00f0ff, 0x00ffa3]; // 炫彩果冻红、电光青、翡翠绿
function roundRectPath(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x+r, y); g.lineTo(x+w-r, y); g.quadraticCurveTo(x+w, y, x+w, y+r);
  g.lineTo(x+w, y+h-r); g.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  g.lineTo(x+r, y+h); g.quadraticCurveTo(x, y+h, x, y+h-r);
  g.lineTo(x, y+r); g.quadraticCurveTo(x, y, x+r, y); g.closePath();
}
function makeTileTexture(colorHex) {
  const s = 1024; const cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d'); g.clearRect(0, 0, s, s);
  const c  = new THREE.Color(colorHex);
  const cl = new THREE.Color(colorHex).lerp(new THREE.Color(0xffffff), 0.7);
  const cd = new THREE.Color(colorHex).lerp(new THREE.Color(0x000000), 0.55);
  const rgb = col => `${Math.round(col.r*255)},${Math.round(col.g*255)},${Math.round(col.b*255)}`;
  const cr = 180;

  // 1. 最外层厚实胶囊包裹底座外框 (Heavy Encapsulation Rim)
  g.fillStyle = `rgb(${rgb(cd)})`; roundRectPath(g, 0, 0, s, s, cr); g.fill();

  // 2. 沉降内槽 (Recessed Inner Channel)
  g.fillStyle = 'rgba(0,0,0,0.4)'; roundRectPath(g, 32, 32, s - 64, s - 64, cr - 24); g.fill();

  // 3. 3D 渐变果冻主体面板 (Glossy Panel)
  const grad = g.createLinearGradient(0, 56, 0, s - 56);
  grad.addColorStop(0,   `rgb(${rgb(cl)})`);
  grad.addColorStop(0.45, `rgb(${rgb(c)})`);
  grad.addColorStop(1,   `rgb(${rgb(cd)})`);
  g.fillStyle = grad; roundRectPath(g, 56, 56, s - 112, s - 112, cr - 40); g.fill();

  // 4. 柔光玻璃顶部高光弧带 (Top Arc Highlight)
  g.fillStyle = 'rgba(255,255,255,0.48)';
  roundRectPath(g, 112, 80, s - 224, 192, 72); g.fill();

  // 5. 亮色内凸起描边 (Inner Beveled Stroke)
  g.strokeStyle = `rgba(${rgb(cl)},0.95)`; g.lineWidth = 24;
  roundRectPath(g, 96, 96, s - 192, s - 192, cr - 72); g.stroke();

  // 6. 矢量高清 3D 精致单箭头 (Ultra-Sharp 4K Embossed Arrow)
  const cx = s / 2, cy = s / 2 + 10;
  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round';
  
  // 6a. 箭头底座深色沉降阴影 (Crisp Solid Drop Shadow)
  g.strokeStyle = 'rgba(0, 0, 0, 0.45)'; g.lineWidth = 100;
  g.beginPath(); g.moveTo(cx - 144, cy + 80); g.lineTo(cx, cy - 88); g.lineTo(cx + 144, cy + 80); g.stroke();

  // 6b. 箭头鲜艳半透明边缘衬底 (Vibrant Accent Rim)
  g.strokeStyle = `rgba(${rgb(cl)}, 0.65)`; g.lineWidth = 84;
  g.beginPath(); g.moveTo(cx - 140, cy + 70); g.lineTo(cx, cy - 88); g.lineTo(cx + 140, cy + 70); g.stroke();

  // 6c. 箭头纯白主体 (Crisp White Arrow Body)
  g.strokeStyle = '#ffffff'; g.lineWidth = 64;
  g.beginPath(); g.moveTo(cx - 136, cy + 64); g.lineTo(cx, cy - 88); g.lineTo(cx + 136, cy + 64); g.stroke();

  // 6d. 箭头顶部高光切线 (Razor-Sharp Top Highlight)
  g.strokeStyle = 'rgba(255, 255, 255, 0.95)'; g.lineWidth = 20;
  g.beginPath(); g.moveTo(cx - 120, cy + 54); g.lineTo(cx, cy - 76); g.lineTo(cx + 120, cy + 54); g.stroke();

  g.restore();

  const tex = new THREE.CanvasTexture(cv); 
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 16;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}

// ---- 当前关卡运行参数 ----
let SPEED, HOP_PERIOD, SPECIAL_EVERY, PITCH, levelDist = 0;
let traveled = 0;
let POOL_SPAN = 0;          
let finishObj = null;
let finishZ0 = 0;
const platforms = [];

const TWO_LANE_PROB = 0.45;       
function randInt(n) { return Math.floor(Math.random() * n); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function pickColors(cur, two) {
  if (!two) return [0, 1, 2];
  const others = [0, 1, 2].filter(c => c !== cur);
  return [cur, others[randInt(2)]];
}
function planLanes(colors) {
  if (colors.length === 3) {
    const s = shuffle([0, 1, 2]);
    return s.map(slot => ({ ci: colors[slot], x: laneXs[slot] }));
  }
  const pair = colors.slice();
  if (Math.random() < 0.5) pair.reverse();
  return [{ ci: pair[0], x: -LANE_STEP / 2 }, { ci: pair[1], x: LANE_STEP / 2 }];
}

function resetTrackState() {
  traveled = 0;
  clearFragments();
  for (const s of platforms) scene.remove(s);
  platforms.length = 0;
  if (finishObj) { scene.remove(finishObj); finishObj = null; }
  ball.position.set(0, TILE_H + ballR, 0); ball.rotation.set(0, 0, 0);
  ball.visible = true; contact.visible = true;
  resetTrail();
  t = 0; angle = 0; prevP = 0; mouseX = 0; score = 0; displayScore = 0;
  combo = 0; perfectCount = 0;
  if (progBall) progBall.style.left = '0%';
  if (elCombo) gsap.to(elCombo, { opacity: 0, duration: 0.2 });
}

function buildTrack(n) {
  buildMusicTrack(n, SONGS[n]);
}

function buildMusicTrack(n, song) {
  resetTrackState();
  HOP_PERIOD = 60 / song.bpm;
  const events = song.events, lands = events.map(e => e.b), N = lands.length, last = events[N - 1];
  
  // 求解当前曲目最小音符间隔，计算自适应 PITCH (Adaptive Beat Pitch)
  let minGap = 1.0;
  for (let i = 0; i < N - 1; i++) {
    const g = lands[i+1] - lands[i];
    if (g > 0.05 && g < minGap) minGap = g;
  }
  // 保证最小音符间距 (PITCH * minGap) 始终大于轨道标准长度 (2.4m) 加上 0.6m 清晰间隙，从根本上解决重叠
  PITCH = Math.max(3.6, 3.0 / minGap);
  SPEED = PITCH / HOP_PERIOD;
  SPECIAL_EVERY = 0;

  const finishBeat = last.b + last.d; levelDist = finishBeat * PITCH;
  const noteAt = {};                    
  for (const e of events) noteAt[e.b] = e.n;

  let curColor = (NOTE_COLOR[events[0].n] !== undefined) ? NOTE_COLOR[events[0].n] : 0;  
  for (let i = 0; i < N; i++) {
    const b = lands[i], z0 = -PITCH * b, isAccent = (b % 4 === 0);     
    if (isAccent) {
      const note = noteAt[b] || song.notes[b] || 'C4';
      const ci = (NOTE_COLOR[note] !== undefined) ? NOTE_COLOR[note] : (b % 3);
      makeTile(specBaseGeo, specTopGeo, specialMats[ci], specialSideMats[ci], ci, true, 0, z0);
      curColor = ci;                    
    } else {
      const plan = planLanes(pickColors(curColor, Math.random() < TWO_LANE_PROB));
      for (const item of plan) {
        makeTile(laneBaseGeo, laneTopGeo, platMats[item.ci], sideMats[item.ci], item.ci, false, item.x, z0);
      }
    }
  }

  const lastBeat = lands[N - 1];
  for (let b = lastBeat + 1; b <= finishBeat + 1; b++) {
    const z0 = -PITCH * b;
    for (let li = 0; li < LANES; li++) {
      const ci = (b + li) % 3;
      makeTile(laneBaseGeo, laneTopGeo, platMats[ci], sideMats[ci], ci, false, laneXs[li], z0);
    }
  }

  finishObj = buildFinish();
  finishZ0 = -levelDist;
  finishObj.position.z = finishZ0;
  scene.add(finishObj);
  POOL_SPAN = (finishBeat + 2) * PITCH;
  landTimes = lands.map(b => b * HOP_PERIOD);
  landIdx = 1;
  setBallColor(landingInfo(0).colorIndex);   
}

function groupAtZ0() {
  let bestZ = Infinity, group = [];
  for (let i = 0; i < platforms.length; i++) {
    const s = platforms[i];
    const dz = Math.abs(s.position.z);
    if (dz < bestZ - 1e-3) { bestZ = dz; group = [s]; }
    else if (Math.abs(dz - bestZ) < 1e-3) group.push(s);
    else if (dz > bestZ + 4.0) break; // ponytail: platforms ordered by Z, stop scanning far tiles
  }
  return group;
}

function landingInfo(bx) {
  const group = groupAtZ0();
  const sp = group.find(s => s.userData.isSpecial);
  if (sp) return { special: true, colorIndex: sp.userData.colorIndex, ratio: 1, perfect: true };
  const left = bx - ballR, right = bx + ballR;
  let bestOv = 0, bestColor = 0, bestDist = Infinity, nearColor = 0;
  for (const s of group) {
    if (s.userData.isSpecial) continue;
    const lo = s.position.x - LANE_W / 2, hi = s.position.x + LANE_W / 2;
    const ov = Math.max(0, Math.min(right, hi) - Math.max(left, lo));
    const d = Math.abs(s.position.x - bx);
    if (ov > bestOv) { bestOv = ov; bestColor = s.userData.colorIndex; }
    if (d < bestDist) { bestDist = d; nearColor = s.userData.colorIndex; }
  }
  if (bestOv <= 1e-4) return { special: false, colorIndex: nearColor, ratio: 0, perfect: false };  
  const ratio = bestOv / (2 * ballR);
  return { special: false, colorIndex: bestColor, ratio, perfect: ratio > PERFECT_RATIO };
}

function doLanding(bx) {
  const info = landingInfo(bx);
  if (info.special) {
    setBallColor(info.colorIndex);                       
    combo++; perfectCount++;
    addScore(200 * Math.min(combo, 5));                      
    showReward(true); updateCombo();
    landingFX(bx, info.colorIndex);
  } else if (info.colorIndex !== ballColorIndex) {
    shatter(ball.position.x, ball.position.y, ball.position.z, ballColorIndex);
    failLevel();
  } else if (info.perfect) {
    combo++; perfectCount++;
    addScore(200 * Math.min(combo, 5));                      
    showReward(true); updateCombo();
    landingFX(bx, info.colorIndex);
  } else {
    combo = 0;                                              
    addScore(100); showReward(false); updateCombo();
    landingFX(bx, info.colorIndex);
  }
}

// 粉碎碎片
const fragments = [];
const fragGeo = new THREE.SphereGeometry(ballR * 0.28, 10, 10);
function shatter(x, y, z, colorIdx) {
  ball.visible = false; contact.visible = false;
  for (let i = 0; i < 16; i++) {
    const m = new THREE.Mesh(fragGeo, new THREE.MeshStandardMaterial({
      color: SEG_COLORS[colorIdx], roughness: 0.5, metalness: 0.05 }));
    m.position.set(x, y, z);
    const dir = new THREE.Vector3(Math.random()*2-1, Math.random()*1.4+0.3, Math.random()*2-1).normalize();
    const sp = 3 + Math.random()*4;
    fragments.push({ mesh: m, vel: dir.multiplyScalar(sp),
      ang: new THREE.Vector3(Math.random()*6-3, Math.random()*6-3, Math.random()*6-3), life: 1 });
    scene.add(m);
  }

  // GSAP 镜头震动剧烈反馈 (Screen Shake)
  const shakeObj = { x: 0, y: 0 };
  gsap.to(shakeObj, {
    x: 1, y: 1, duration: 0.45, ease: "power2.out",
    onUpdate: () => {
      camera.position.x = (Math.random() - 0.5) * 0.5;
      camera.position.y = 5 + (Math.random() - 0.5) * 0.5;
    },
    onComplete: () => {
      camera.position.set(0, 5, 11);
    }
  });
}
function updateFragments(dt) {
  for (let i = fragments.length - 1; i >= 0; i--) {
    const f = fragments[i];
    f.vel.y -= 9.8 * dt;
    f.mesh.position.addScaledVector(f.vel, dt);
    f.mesh.rotation.x += f.ang.x * dt; f.mesh.rotation.y += f.ang.y * dt;
    f.life -= dt * 0.8;
    f.mesh.scale.setScalar(Math.max(0.01, f.life));
    if (f.life <= 0) { scene.remove(f.mesh); f.mesh.material.dispose(); fragments.splice(i, 1); }
  }
}
function clearFragments() {
  for (const f of fragments) { scene.remove(f.mesh); f.mesh.material.dispose(); }
  fragments.length = 0;
}

// 关卡开始 GSAP 3D 缓冲倒计时 (Level Start Countdown Buffer)
const elCountdown = document.getElementById('countdown');
let countdownTween = null;

function stopCountdown() {
  if (countdownTween) { countdownTween.kill(); countdownTween = null; }
  if (elCountdown) {
    elCountdown.style.display = 'none';
    gsap.set(elCountdown, { opacity: 0, scale: 1 });
  }
}

function runCountdown(onComplete) {
  stopCountdown();
  state = 'countdown';
  t = 0;
  elCountdown.style.display = 'block';
  
  const steps = ['3', '2', '1', 'GO!'];
  countdownTween = gsap.timeline({
    onComplete: () => {
      elCountdown.style.display = 'none';
      state = 'playing';
      if (onComplete) onComplete();
    }
  });

  steps.forEach((step, idx) => {
    countdownTween.call(() => {
      elCountdown.textContent = step;
      elCountdown.className = (step === 'GO!') ? 'go' : '';
    })
    .fromTo(elCountdown, 
      { opacity: 0, scale: 2.4, rotation: idx % 2 === 0 ? -6 : 6 },
      { opacity: 1, scale: 1.0, rotation: 0, duration: 0.38, ease: "back.out(2.2)" }
    )
    .to(elCountdown, 
      { opacity: 0, scale: 0.65, duration: 0.22, ease: "power2.in", delay: 0.25 }
    );
  });
}

  document.getElementById('pauseProg').innerHTML =
    `第 <b>${currentLevel}</b> 关 · 进度 <b>${(Math.min(1, traveled / levelDist) * 100).toFixed(0)}%</b> · PERFECT ×<b>${perfectCount}</b>` +

  );

  });

  state = 'won';

  if (newTime) best[currentLevel] = time;
  const newScore = (!bestScore[currentLevel] || score > bestScore[currentLevel]);

  if (currentLevel < 9 && currentLevel + 1 > unlocked) unlocked = currentLevel + 1;
  saveProgress();
  document.getElementById('winSub').innerHTML =
    `第 ${currentLevel} 关 · 用时 ${time.toFixed(1)} 秒` + (newTime ? '（新纪录！）' : '') +

    )
    .to(elReward, {
      opacity: 0, y: -35, scale: 0.85, duration: 0.38, ease: "power2.in", delay: 0.2
    });
}

// 连击计数显示 (GSAP Elastic Pulse)
function updateCombo() {
  if (combo >= 2) {
    elCombo.textContent = `COMBO ×${combo}`;
    gsap.killTweensOf(elCombo);
    gsap.fromTo(elCombo,
      { opacity: 0, scale: 1.7, rotation: -4 },
      { opacity: 1, scale: 1.0, rotation: 0, duration: 0.35, ease: "elastic.out(1.2, 0.4)" }
    );
  } else {
    gsap.to(elCombo, { opacity: 0, scale: 0.8, duration: 0.2, ease: "power2.out" });
  }
}

// 按钮微交互绑定 (GSAP Button Micro-interactions)
document.querySelectorAll('.btn, .home-btn, .home-ghost, .card').forEach(btn => {
  btn.addEventListener('mouseenter', () => {
    if (btn.classList.contains('locked')) return;
    gsap.to(btn, { scale: 1.06, y: -2, duration: 0.2, ease: "power2.out" });
  });
  btn.addEventListener('mouseleave', () => {
    if (btn.classList.contains('locked')) return;
    gsap.to(btn, { scale: 1.0, y: 0, duration: 0.25, ease: "power2.out" });
  });
  btn.addEventListener('mousedown', () => {
    if (btn.classList.contains('locked')) return;
    gsap.to(btn, { scale: 0.95, duration: 0.1, ease: "power1.out" });
  });
  btn.addEventListener('mouseup', () => {
    if (btn.classList.contains('locked')) return;
    gsap.to(btn, { scale: 1.06, duration: 0.15, ease: "back.out(2)" });
  });
});

// UI 卡片 3D 视角跟随 (Mouse Tilt FX)
document.querySelectorAll('.panel, .home-card').forEach(card => {
  card.addEventListener('mousemove', (e) => {
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const rx = ((e.clientY - cy) / (rect.height / 2)) * -6;
    const ry = ((e.clientX - cx) / (rect.width / 2)) * 6;
    gsap.to(card, { rotationX: rx, rotationY: ry, duration: 0.3, ease: "power1.out" });
  });
  card.addEventListener('mouseleave', () => {
    gsap.to(card, { rotationX: 0, rotationY: 0, duration: 0.5, ease: "power2.out" });
  });
});

// 按钮点击事件绑定
document.getElementById('resumeBtn').onclick = resumeGame;
document.getElementById('restartBtn').onclick = restartLevel;
document.getElementById('toMenuBtn').onclick = goMenu;
document.getElementById('retry').onclick = restartLevel;
document.getElementById('failToMenu').onclick = goMenu;
document.getElementById('winToMenu').onclick = goMenu;
document.getElementById('playBtn').onclick = () => startLevel(1);   
document.getElementById('homeToMenu').onclick = goMenu;            
document.getElementById('menuToHome').onclick = goHome;            

const mp3Input = document.getElementById('mp3Input');
const uploadMp3Btn = document.getElementById('uploadMp3Btn');
if (uploadMp3Btn && mp3Input) {
  uploadMp3Btn.onclick = () => mp3Input.click();
  mp3Input.onchange = (e) => {
    if (e.target.files && e.target.files[0]) {
      loadMp3Audio(e.target.files[0]);
    }
  };
}            

// ESC 暂停 / 继续
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  }
});

// ---- 动画 ----
let angle = 0, t = 0, prevP = 0;
const clock = new THREE.Clock();

function updateBallStretch(h, peak = JUMP_H) {
  if (isLandingTweening) return;
  const norm = Math.min(1, h / Math.max(0.001, peak));
  if (norm > 0.02) {
    const sy = 1.0 + 0.18 * Math.sin(norm * Math.PI);
    const sxz = 1.0 / Math.sqrt(sy);
    ball.scale.set(sxz, sy, sxz);
  } else {
    ball.scale.set(1.0, 1.0, 1.0);
  }
}

function updateCountdown(dt) {
  t += dt;
  const limit = TRACK_HALF - ballR;
  const targetX = THREE.MathUtils.clamp(mouseX * limit, -limit, limit);
  ball.position.x += (targetX - ball.position.x) * Math.min(1, dt * 14);

  const p = (t % HOP_PERIOD) / HOP_PERIOD;
  const height = JUMP_H * 4 * p * (1 - p);
  ball.position.y = TILE_H + ballR + height;

  updateBallStretch(height, JUMP_H);
  spawnTrail(ball.position.x, ball.position.y, ball.position.z, ballColorIndex);
  updateTrail(dt);

  const k = Math.min(1, height / JUMP_H);
  contact.position.x = ball.position.x;
  contact.scale.setScalar(1 - 0.5 * k);
  contact.material.opacity = 0.45 * (1 - 0.65 * k);
  updateBurst(dt);
}

function updateGame(dt) {
  if (usingAudio && actx) {
    t = Math.max(0, actx.currentTime - audioStart);
    traveled = SPEED * t;
  } else {
    t += dt;
    traveled += SPEED * dt;
  }

  angle += (SPEED * dt) / ballR;
  ball.rotation.x = -angle;

  const limit = TRACK_HALF - ballR;
  const targetX = THREE.MathUtils.clamp(mouseX * limit, -limit, limit);
  ball.position.x += (targetX - ball.position.x) * Math.min(1, dt * 14);

  let jumpHeight, curPeak = JUMP_H;
  if (landTimes.length > 0) {
    while (landIdx < landTimes.length && t >= landTimes[landIdx]) {
      doLanding(ball.position.x);
      landIdx++;
      if (state !== 'playing') { updateFragments(dt); return; }   
    }
    if (landIdx < landTimes.length) {
      const a = (landIdx - 1 >= 0) ? landTimes[landIdx - 1] : 0;   
      const b = landTimes[landIdx];                                
      const span = Math.max(1e-3, b - a);                          
      const gapBeats = span / HOP_PERIOD;
      curPeak = JUMP_H * (gapBeats > 1 ? Math.min(2.6, 0.8 + gapBeats * 0.6) : 1);  
      const p = THREE.MathUtils.clamp((t - a) / span, 0, 1);
      jumpHeight = curPeak * 4 * p * (1 - p);
    } else {
      jumpHeight = 0;   
    }
    ball.position.y = TILE_H + ballR + jumpHeight;
    prevP = 0;
  } else {
    const p = (t % HOP_PERIOD) / HOP_PERIOD;
    jumpHeight = JUMP_H * 4 * p * (1 - p);
    ball.position.y = TILE_H + ballR + jumpHeight;
    if (p < prevP) {
      doLanding(ball.position.x);
      if (state !== 'playing') { updateFragments(dt); updateBurst(dt); return; }   
    }
    prevP = p;
  }

  updateBallStretch(jumpHeight, curPeak);
  spawnTrail(ball.position.x, ball.position.y, ball.position.z, ballColorIndex);
  updateTrail(dt);

  for (const seg of platforms) {
    seg.position.z = seg.userData.z0 + traveled;
    if (seg.userData.shakeT > 0) {
      seg.userData.shakeT -= dt;
      const tt = Math.max(0, seg.userData.shakeT);
      const amp = SHAKE_AMP * (tt / SHAKE_DUR);
      seg.position.y = seg.userData.baseY + Math.sin(tt * SHAKE_FREQ) * amp;
    } else if (seg.userData.shook) {
      seg.position.y = seg.userData.baseY;     
      seg.userData.shook = false;
    }
  }
  finishObj.position.z = finishZ0 + traveled;
  updateBurst(dt);

  const k = Math.min(1, jumpHeight / Math.max(0.001, curPeak));
  contact.position.x = ball.position.x;
  contact.scale.setScalar(1 - 0.5 * k);
  contact.material.opacity = 0.45 * (1 - 0.65 * k);

  elHudSub.textContent = `第 ${currentLevel} 关 · PERFECT ×${perfectCount}` + (SONGS[currentLevel] ? ` · ♪ ${SONGS[currentLevel].name}` : '');
  const prog = Math.max(0, Math.min(1, traveled / levelDist));
  progBall.style.left = (prog * 100) + '%';

  if (finishObj.position.z >= 0) { winLevel(); return; }
}

function updateHome(dt) {
  t += dt;
  const v = SPEED * dt;
  traveled += v;
  angle += v / ballR;
  ball.rotation.x = -angle;
  const p = (t % HOP_PERIOD) / HOP_PERIOD;
  const height = JUMP_H * 4 * p * (1 - p);
  ball.position.y = TILE_H + ballR + height;
  ball.position.x += (0 - ball.position.x) * Math.min(1, dt * 14);

  updateBallStretch(height, JUMP_H);
  spawnTrail(ball.position.x, ball.position.y, ball.position.z, ballColorIndex);
  updateTrail(dt);

  for (const seg of platforms) {
    let z = seg.userData.z0 + traveled;
    if (z > 14) z -= POOL_SPAN;
    seg.position.z = z;
  }
  if (finishObj) { let fz = finishZ0 + traveled; if (fz > 14) fz -= POOL_SPAN; finishObj.position.z = fz; }
  updateBurst(dt);
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state === 'playing') updateGame(dt);
  else if (state === 'countdown') updateCountdown(dt);
  else if (state === 'home') updateHome(dt);
  else if (state === 'dead') { updateBurst(dt); updateTrail(dt); }
  
  if (state !== 'paused') {
    updateParticles(dt);
    const pulse = 0.45 + 0.3 * Math.sin(t * 4);
    for (const m of specialMats) m.emissiveIntensity = pulse;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

// 启动
goHome();
tick();
</script>
